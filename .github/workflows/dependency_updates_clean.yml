name: Dependency Updates

on:
  schedule:
    - cron: '0 10 * * MON'  # Every Monday at 10 AM UTC
  workflow_dispatch:

jobs:
  update_dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.2'
        channel: 'stable'
        cache: true

    - name: Check current dependencies
      run: |
        echo "Current dependencies:"
        flutter pub deps --style=compact

    - name: Update dependencies
      run: |
        echo "Updating dependencies..."
        flutter pub upgrade    - name: Run code generation
      run: dart run build_runner build --delete-conflicting-outputs

    - name: Run tests to verify updates
      run: |
        echo "Running tests to verify dependency updates..."
        flutter test

    - name: Check for analysis issues
      run: |
        echo "Checking for analysis issues after updates..."
        flutter analyze

    - name: Build to verify everything works
      run: |
        echo "Building web to verify updates..."
        flutter build web --release

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: 'chore: update dependencies'
        title: 'chore: automated dependency updates'
        body: |
          ## Automated Dependency Updates
          
          This PR was automatically created to update Flutter dependencies.
          
          ### Changes
          - Updated all dependencies to latest compatible versions
          - Verified tests still pass
          - Verified code analysis passes
          - Verified web build succeeds
          
          ### Next Steps
          - Review the changes
          - Run integration tests if needed
          - Merge if everything looks good
          
          ---
          *This PR was created automatically by the dependency update workflow.*
        branch: chore/dependency-updates
        delete-branch: true

  check_flutter_version:
    name: Check Flutter Version
    runs-on: ubuntu-latest

    steps:
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.2'
        channel: 'stable'

    - name: Check for newer Flutter versions
      run: |
        echo "Current Flutter version: $(flutter --version)"
        echo "Checking for newer Flutter versions..."
        flutter channel stable
        flutter upgrade --dry-run || true

    - name: Create Flutter update issue
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Consider updating Flutter version';
          const body = `
          ## Flutter Version Check
          
          The nightly check found that there might be a newer Flutter version available.
          
          Current version in CI: 3.32.2
          
          ### Action Items
          - [ ] Check if a newer stable Flutter version is available
          - [ ] Test the project with the newer version
          - [ ] Update the workflow files if the newer version works
          - [ ] Update \`README.md\` with the new version requirements
          
          This issue was created automatically by the dependency update workflow.
          `;
          
          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['flutter-version']
          });
          
          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['flutter-version', 'enhancement']
            });
          }
