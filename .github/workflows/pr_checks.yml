name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

jobs:
  pr-checks:
    name: PR Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.32.2'
        channel: 'stable'
        cache: true
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Check formatting
      run: dart format --set-exit-if-changed lib/ test/
      
    - name: Analyze code
      run: flutter analyze --fatal-infos
      
    - name: Run widget tests
      run: flutter test test/
      
    - name: Check for TODO/FIXME comments
      run: |
        if grep -r "TODO\|FIXME" lib/ test/ --exclude-dir=.git || true; then
          echo "::warning::Found TODO/FIXME comments in code"
        fi
        
    - name: Validate pubspec.yaml
      run: |
        if ! dart pub deps > /dev/null 2>&1; then
          echo "::error::pubspec.yaml has dependency issues"
          exit 1
        fi
        
    - name: Check build size (Web)
      run: |
        flutter config --enable-web
        flutter build web --release --web-renderer html
        BUILD_SIZE=$(du -sh build/web | cut -f1)
        echo "Web build size: $BUILD_SIZE"
        echo "BUILD_SIZE=$BUILD_SIZE" >> $GITHUB_ENV
        
    - name: Comment build info on PR
      uses: actions/github-script@v7
      with:
        script: |
          const buildSize = process.env.BUILD_SIZE;
          const body = `## Build Information 📊
          
          - **Web build size**: ${buildSize}
          - **Flutter version**: 3.32.2
          - **Platform**: Web only (Ubuntu runner)
          
          ✅ All quality checks passed!`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });